<!doctype html>
<html lang="si">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Capture and Send via Formspree</title>
<style>
:root{--bg:#071428;--card:#0f1b2a;--accent:#0b74de;--ok:#16a34a;--muted:#9aa7b2}
body{margin:0;font-family:Inter,system-ui,Segoe UI,Arial;background:linear-gradient(180deg,#071022,#071a2a);color:#e6eef6;display:flex;align-items:center;justify-content:center;height:100vh;padding:20px}
.card{background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));padding:20px;border-radius:12px;max-width:920px;width:100%;box-shadow:0 8px 30px rgba(2,6,23,0.6)}
h1{margin:0 0 8px;font-size:20px}
p.lead{color:var(--muted);margin:0 0 16px}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
button{background:var(--accent);color:white;border:0;padding:10px 14px;border-radius:8px;cursor:pointer;font-weight:600}
button.ghost{background:transparent;border:1px solid rgba(255,255,255,0.06);color:var(--muted)}
button.send{background:var(--ok)}
video,img{border-radius:8px;background:#000;max-width:100%}
.meta{margin-top:12px;color:var(--muted);font-size:13px}
.hidden{display:none}
.modal-backdrop{position:fixed;inset:0;background:rgba(2,6,23,0.6);display:flex;align-items:center;justify-content:center}
.modal{background:#071428;padding:22px;border-radius:12px;max-width:720px;width:92%}
.row{display:flex;gap:8px;align-items:center}
</style>
</head>
<body>
  <div class="card">
    <h1>Secure Capture and Email</h1>
    <p class="lead">පළමුව අවසර දෙන්න. පසුව Capture කර Send to email ක්ලික් කරන්න.</p>

    <div class="controls">
      <button id="startFlow">Start Secure Flow</button>
      <button id="showConsent" class="ghost">Show Consent</button>
    </div>

    <div id="status" class="meta">Status: <span id="statustxt">idle</span></div>

    <div id="mediaArea" class="hidden" style="margin-top:14px">
      <div style="display:flex;gap:12px;flex-wrap:wrap">
        <video id="preview" autoplay playsinline muted style="width:360px;height:240px;object-fit:cover"></video>
        <div style="flex:1">
          <div style="display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap">
            <button id="capturePhoto">Capture Photo</button>
            <button id="recordVideo" class="ghost">Record 5s Video</button>
            <button id="recordAudio" class="ghost">Record 5s Audio</button>
            <button id="sendEmail" class="send">Send to email</button>
          </div>
          <div id="captures"></div>
        </div>
      </div>
      <div id="metaInfo" class="meta"></div>
    </div>
  </div>

  <div id="consentModal" class="modal-backdrop" style="display:none">
    <div class="modal" role="dialog" aria-modal="true">
      <h2>අවසර අවශ්‍යයි</h2>
      <p class="small">මෙම පිටුව ඔබගේ කැමරා, මයික්‍රොෆෝන් සහ ස්ථානය ලබා ගැනීමට ඉල්ලයි. දත්ත පමණක් ඔබගේ ඉල්ලීම මත email එකට යවනු ලැබේ.</p>
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px">
        <button id="deny" class="ghost">අවසර නොදෙන්න</button>
        <button id="allow">අවසර දෙන්න</button>
      </div>
    </div>
  </div>

<script>
/* ====== CONFIG ====== */
/* Replace with your Formspree form endpoint, e.g. https://formspree.io/f/abcd1234 */
const FORM_ENDPOINT = 'https://formspree.io/f/REPLACE_WITH_YOUR_ID';
/* ====== END CONFIG ====== */

const startFlow = document.getElementById('startFlow');
const showConsent = document.getElementById('showConsent');
const consentModal = document.getElementById('consentModal');
const allowBtn = document.getElementById('allow');
const denyBtn = document.getElementById('deny');
const statusTxt = document.getElementById('statustxt');
const mediaArea = document.getElementById('mediaArea');
const preview = document.getElementById('preview');
const capturePhoto = document.getElementById('capturePhoto');
const recordVideo = document.getElementById('recordVideo');
const recordAudio = document.getElementById('recordAudio');
const sendEmail = document.getElementById('sendEmail');
const captures = document.getElementById('captures');
const metaInfo = document.getElementById('metaInfo');

let stream = null;
let lastCapturedBlob = null;
let consentTimestamp = null;

function setStatus(s){ statusTxt.textContent = s; }

showConsent.addEventListener('click', ()=> consentModal.style.display='flex');
startFlow.addEventListener('click', ()=> consentModal.style.display='flex');
denyBtn.addEventListener('click', ()=> { consentModal.style.display='none'; setStatus('User denied consent'); alert('අවසර නොදුන්නා.'); });

allowBtn.addEventListener('click', async ()=>{
  consentModal.style.display='none';
  consentTimestamp = new Date().toISOString();
  setStatus('Requesting permissions...');
  try {
    if(location.protocol !== 'https:' && location.hostname !== 'localhost'){
      alert('HTTPS අවශ්‍යයි. Use localhost or HTTPS for testing.');
      setStatus('HTTPS required');
      return;
    }
    stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment' }, audio:true });
    preview.srcObject = stream;
    mediaArea.classList.remove('hidden');
    setStatus('Permissions granted');
    let info = [];
    if(navigator.getBattery){
      const b = await navigator.getBattery();
      info.push('Battery ' + Math.round(b.level*100) + '%');
    }
    if(navigator.connection) info.push('Connection ' + (navigator.connection.effectiveType || 'unknown'));
    metaInfo.textContent = info.join(' • ');
  } catch(err){
    console.error(err);
    setStatus('Permission error');
    alert('Permission error: ' + err.message);
  }
});

// Capture photo
capturePhoto.addEventListener('click', ()=>{
  if(!stream) return alert('No stream');
  const canvas = document.createElement('canvas');
  canvas.width = 1280; canvas.height = 720;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(preview, 0, 0, canvas.width, canvas.height);
  canvas.toBlob(blob=>{
    lastCapturedBlob = blob;
    const img = document.createElement('img');
    img.src = URL.createObjectURL(blob);
    img.style.maxWidth = '220px';
    captures.appendChild(img);
    setStatus('Photo captured');
  }, 'image/jpeg', 0.92);
});

// Record 5s video
recordVideo.addEventListener('click', async ()=>{
  if(!stream) return alert('No stream');
  setStatus('Recording video 5s...');
  const recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
  const chunks = [];
  recorder.ondataavailable = e=>chunks.push(e.data);
  recorder.start();
  await new Promise(r=>setTimeout(r,5000));
  recorder.stop();
  recorder.onstop = ()=> {
    const blob = new Blob(chunks, { type:'video/webm' });
    lastCapturedBlob = blob;
    const v = document.createElement('video');
    v.controls = true; v.src = URL.createObjectURL(blob); v.style.maxWidth='320px';
    captures.appendChild(v);
    setStatus('Video recorded');
  };
});

// Record 5s audio
recordAudio.addEventListener('click', async ()=>{
  try {
    const aStream = await navigator.mediaDevices.getUserMedia({ audio:true, video:false });
    setStatus('Recording audio 5s...');
    const recorder = new MediaRecorder(aStream);
    const chunks = [];
    recorder.ondataavailable = e=>chunks.push(e.data);
    recorder.start();
    await new Promise(r=>setTimeout(r,5000));
    recorder.stop();
    recorder.onstop = ()=> {
      const blob = new Blob(chunks, { type:'audio/webm' });
      lastCapturedBlob = blob;
      const a = document.createElement('audio');
      a.controls = true; a.src = URL.createObjectURL(blob);
      captures.appendChild(a);
      setStatus('Audio recorded');
      aStream.getTracks().forEach(t=>t.stop());
    };
  } catch(e){
    console.error(e);
    alert('Audio permission error: ' + e.message);
  }
});

// Send to Formspree
sendEmail.addEventListener('click', async ()=>{
  if(!lastCapturedBlob) return alert('No captured media to send');
  if(!FORM_ENDPOINT || FORM_ENDPOINT.includes('REPLACE_WITH')) return alert('Set FORM_ENDPOINT in the script first');
  setStatus('Sending to Formspree...');
  try {
    // optional: geolocation
    let location = null;
    try {
      location = await new Promise((res,rej)=>{
        navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lon:p.coords.longitude}), e=>res(null), {timeout:5000});
      });
    } catch(e){ location = null; }

    const form = new FormData();
    // Formspree expects "file" field for attachments; also include metadata fields
    form.append('file', lastCapturedBlob, 'capture.bin');
    form.append('consentTimestamp', consentTimestamp || '');
    form.append('meta', JSON.stringify({ location }));

    const resp = await fetch(FORM_ENDPOINT, { method:'POST', body: form });
    if(!resp.ok){
      const txt = await resp.text();
      throw new Error(`Server returned ${resp.status}: ${txt}`);
    }
    // Formspree returns JSON or redirect; treat success if ok
    setStatus('Sent via Formspree');
    alert('Data sent. Check the recipient email.');
  } catch(e){
    console.error(e);
    setStatus('Send failed');
    alert('Send failed: ' + e.message);
  }
});

window.addEventListener('beforeunload', ()=> {
  if(stream) stream.getTracks().forEach(t=>t.stop());
});
</script>
</body>
</html>
